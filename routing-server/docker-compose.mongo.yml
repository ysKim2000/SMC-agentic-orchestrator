services:
  mongo:
    image: mongo:7
    container_name: maple-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - maple-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init-replica:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >
        mongosh 'mongodb://mongo:27017/?directConnection=true' --quiet --eval
        'try { rs.status() } catch (e) {
          rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})
        }'

volumes:
  maple-mongo-data:
    name: maple-mongo-data
